<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Primer Proyecto</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #080808;
      color: white;
    }

    .hero {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 30px;
      background: linear-gradient(135deg, #050505, #172033);
    }

    .contenido {
      max-width: 850px;
    }

    h1 {
      font-size: 64px;
      margin-bottom: 20px;
    }

    p {
      font-size: 22px;
      color: #c9c9c9;
      margin-bottom: 35px;
    }

    .boton {
      display: inline-block;
      padding: 16px 32px;
      background: white;
      color: black;
      text-decoration: none;
      border-radius: 10px;
      font-weight: bold;
      font-size: 18px;
    }

    .boton:hover {
      transform: scale(1.05);
    }
  </style>
</head>

<body>

  <section class="hero">
    <div class="contenido">
      <h1>Estamos construyendo algo grande.</h1>
      <p>Mi primer proyecto desarrollado con Visual Studio Code y GitHub.</p>

      <a class="boton" href="#">Explorar proyecto</a>
    </div>
  </section>

</body
